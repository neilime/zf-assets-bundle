name: Continuous integration
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}-checks
  cancel-in-progress: true
jobs:
  checks:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/continuous-integration.yml@6d0964888074223db9c53b756d004846f3a1569e # 2.0.1
    permissions:
      contents: read
      id-token: write
    with:
      extensions: mbstring, dom, xml, xmlwriter, curl, zip, intl, gd
      package: "true"
