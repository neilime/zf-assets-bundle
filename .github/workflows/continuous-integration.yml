name: Continuous integration
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}-checks
  cancel-in-progress: true
jobs:
  checks:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/continuous-integration.yml@63aed766521b3b3bff31c4d36f59b2916e90a361 # 2.0.3
    permissions:
      contents: read
      id-token: write
    with:
      extensions: mbstring, dom, xml, xmlwriter, curl, zip, intl, gd
      package: "true"
